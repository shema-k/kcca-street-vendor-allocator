# KCCA VRSP — Apache hardening for the container.
#
# Loaded by `a2enconf kcca` (see Dockerfile) and applies server-wide.

ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<Directory /var/www/html>
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>

# `database/seed.php` drops and rebuilds every table. It is a command-line
# tool; over HTTP it would destroy the working data. The rest of that
# directory is schema dumps and diagnostics, also not for the browser.
<Directory /var/www/html/database>
    Require all denied
</Directory>

# Container plumbing, launcher scripts and release archives.
<Directory /var/www/html/docker>
    Require all denied
</Directory>

<FilesMatch "\.(sql|md|sh|bat|ps1|vbs|zip|log|ini|dist|example)$">
    Require all denied
</FilesMatch>

# Dotfiles (.git, .env, .dockerignore) but not ACME challenges.
<FilesMatch "^\.(?!well-known)">
    Require all denied
</FilesMatch>

<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(self), camera=(), microphone=()"
</IfModule>
