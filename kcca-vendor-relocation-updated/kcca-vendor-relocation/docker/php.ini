; KCCA VRSP — PHP runtime settings for the container.
; Applied on top of the image defaults (see /usr/local/etc/php/php.ini-production).

expose_php = Off

; Errors go to the log, never to a trader's screen. lib/ErrorHandler.php
; renders its own message and reference number.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/php/error.log
error_reporting = E_ALL

memory_limit = 256M
max_execution_time = 120
max_input_time = 120
post_max_size = 16M
upload_max_filesize = 16M

date.timezone = Africa/Kampala

; Sessions. The application names its own session (KCCA_VRSP_SESS) and sets
; HttpOnly/SameSite itself; strict mode stops an attacker-supplied ID from
; being adopted.
session.save_path = /var/lib/php/sessions
session.use_strict_mode = 1
session.cookie_httponly = 1
session.gc_maxlifetime = 7200
session.gc_probability = 1
session.gc_divisor = 1000

; The image is immutable, but docker-compose.dev.yml bind-mounts the source,
; so keep timestamp validation on. In production set it to 0.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
